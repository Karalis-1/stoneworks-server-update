name: Validate server version
description: Validates server_version.json format
runs:
  using: composite
  steps:
    - name: Validate version file
      shell: bash
      run: |
        set -euo pipefail
        jq -e '
          (.version | type == "string" and test("^[0-9]{2}/[0-9]{2}/[0-9]{4}-[0-9]+$"))
          and ((.dry_run // false) | type == "boolean")
        ' server_version.json >/dev/null
        source .github/log.sh
        log info "server_version.json is valid"
